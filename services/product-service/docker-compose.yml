services:
  product-service:
    build:
      context: ../..
      dockerfile: services/product-service/Dockerfile.local
    image: product-service:local
    ports:
      - "8081:8081"
    volumes:
      - ../../shared:/workspace/shared
      - .:/workspace/services/product-service
    environment:
      - AIR_DEBUG=true
      - CMD=local
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=productdb
      - SSL_MODE=disable
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=productdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
